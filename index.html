<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Happy Town Quest</title>
<style>
:root{--ink:#2b3a4a;--paper:#fffaf0;--line:#d9cdb4;--berry:#e8505b;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#bfe6f5;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;display:grid;place-items:center;padding:16px;line-height:1.6}
form{width:100%;max-width:360px;background:var(--paper);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line)}
h1{font-size:24px;line-height:1.2}
label{display:flex;flex-direction:column;gap:4px;font-size:14px}
input[type=text],input[type=password]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;width:100%}
.chk{flex-direction:row;align-items:center;gap:8px}
button{font:inherit;font-weight:700;padding:12px;border-radius:14px;border:0;background:var(--berry);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
input:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{font-size:14px;color:var(--berry);min-height:1.6em}
</style>
</head>
<body>
<form id="f">
  <h1>🏘️ Happy Town Quest</h1>
  <p>遊ぶには ID とパスワードが必要です。</p>
  <label for="uid">ID<input id="uid" type="text" autocomplete="username" autocapitalize="off" required></label>
  <label for="pw">パスワード<input id="pw" type="password" autocomplete="current-password" required></label>
  <label class="chk" for="keep"><input id="keep" type="checkbox" checked>この端末では次から入力を省略する</label>
  <button id="go" type="submit">ゲームをひらく</button>
  <p id="msg" role="alert"></p>
</form>

const un=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const $=s=>document.querySelector(s);
async function makeKey(id,pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(id.trim().toLowerCase()+':'+pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:un(SALT),iterations:ITER,hash:'SHA-256'},base,256));
}
async function openGame(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(IV)},key,un(DATA));
  const html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
const K='happy-town-quest-key';
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!window.crypto||!crypto.subtle){$('#msg').textContent='このブラウザでは開けません。https のURLから開いてください。';return}
  $('#go').disabled=true;$('#msg').textContent='確認しています…';
  try{
    const raw=await makeKey($('#uid').value,$('#pw').value);
    const keep=$('#keep').checked;
    await openGame(raw);
    try{if(keep)localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}
  }catch(_){
    $('#go').disabled=false;$('#msg').textContent='ID かパスワードがちがいます。';
  }
});
// 前に成功した端末では自動でひらく
(async()=>{try{const s=localStorage.getItem(K);if(s&&window.crypto&&crypto.subtle)await openGame(un(s))}catch(_){try{localStorage.removeItem(K)}catch(e){}}})();
</script>
